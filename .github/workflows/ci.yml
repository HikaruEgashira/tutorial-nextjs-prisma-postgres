name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 15
    env:
      POSTGRES_PRISMA_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - name: Start disposable build database
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER ci WITH PASSWORD 'ci'"
          sudo -u postgres createdb -O ci ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Stop disposable build database
        if: always()
        run: sudo service postgresql stop
